<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <!-- Background Linear Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070c1e" />
      <stop offset="50%" stop-color="#0b1633" />
      <stop offset="100%" stop-color="#080f24" />
    </linearGradient>

    <!-- Glowing Accent Gradients -->
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00d2ff" />
      <stop offset="50%" stop-color="#3a7bd5" />
      <stop offset="100%" stop-color="#00f2fe" />
    </linearGradient>

    <linearGradient id="accentOrange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff9900" />
      <stop offset="100%" stop-color="#ff5500" />
    </linearGradient>

    <linearGradient id="pillGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.03" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="lightGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .bg-grid {
      stroke: #16264d;
      stroke-width: 0.7;
      opacity: 0.35;
    }
    .flow-line {
      stroke-dasharray: 8, 12;
      animation: flowAnimation 25s linear infinite;
    }
    .flow-pulse {
      animation: pulseGlow 4s ease-in-out infinite alternate;
    }
    .radar-beam {
      transform-origin: 1050px 180px;
      animation: radarRotate 12s linear infinite;
    }
    .floating-card-1 {
      animation: floatSlow 6s ease-in-out infinite alternate;
    }
    .floating-card-2 {
      animation: floatSlow 7s ease-in-out infinite alternate-reverse;
    }
    .pulse-dot {
      animation: dotBlink 2.5s infinite;
    }

    @keyframes flowAnimation {
      from { stroke-dashoffset: 400; }
      to { stroke-dashoffset: 0; }
    }
    @keyframes pulseGlow {
      0% { opacity: 0.3; }
      100% { opacity: 0.8; }
    }
    @keyframes radarRotate {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    @keyframes floatSlow {
      0% { transform: translateY(0px); }
      100% { transform: translateY(-8px); }
    }
    @keyframes dotBlink {
      0%, 100% { opacity: 0.2; transform: scale(0.9); }
      50% { opacity: 1; transform: scale(1.15); }
    }
  </style>

  <!-- Deep High-Tech Background Canvas -->
  <rect width="1200" height="360" fill="url(#bgGrad)" />

  <!-- Dynamic Grid Pattern in Background -->
  <g class="bg-grid">
    <line x1="0" y1="60" x2="1200" y2="60" />
    <line x1="0" y1="120" x2="1200" y2="120" />
    <line x1="0" y1="180" x2="1200" y2="180" />
    <line x1="0" y1="240" x2="1200" y2="240" />
    <line x1="0" y1="300" x2="1200" y2="300" />
    <line x1="120" y1="0" x2="120" y2="360" />
    <line x1="240" y1="0" x2="240" y2="360" />
    <line x1="360" y1="0" x2="360" y2="360" />
    <line x1="480" y1="0" x2="480" y2="360" />
    <line x1="600" y1="0" x2="600" y2="360" />
    <line x1="720" y1="0" x2="720" y2="360" />
    <line x1="840" y1="0" x2="840" y2="360" />
    <line x1="960" y1="0" x2="960" y2="360" />
    <line x1="1080" y1="0" x2="1080" y2="360" />
  </g>

  <!-- Dynamic Logistics Route & Supply Network Streams (Background layer) -->
  <g opacity="0.45">
    <!-- Curved Global Transit Paths -->
    <path class="flow-line" d="M -50,280 C 250,330 400,190 700,230 S 1050,70 1250,110" fill="none" stroke="#00d2ff" stroke-width="2.5" />
    <path class="flow-line" d="M -20,100 C 300,40 550,220 850,160 S 1100,290 1250,260" fill="none" stroke="#ff9900" stroke-width="1.8" />
    <path class="flow-line" d="M 100,380 C 350,160 750,340 1000,140 S 1180,60 1250,50" fill="none" stroke="#3a7bd5" stroke-width="2" />
  </g>

  <!-- Radar / Telematics Sensor Graphic (Right Flank) -->
  <g transform="translate(1030, 180)" opacity="0.35">
    <circle r="120" fill="none" stroke="#00d2ff" stroke-width="1" stroke-dasharray="4, 6" />
    <circle r="85" fill="none" stroke="#3a7bd5" stroke-width="1" />
    <circle r="50" fill="none" stroke="#00f2fe" stroke-width="1.2" stroke-dasharray="2, 4" />
    <circle r="18" fill="none" stroke="#ff9900" stroke-width="1.5" />
    <!-- Rotating Radar Sector Scan -->
    <g class="radar-beam">
      <path d="M 0,0 L 115,-30 A 120,120 0 0,1 120,0 Z" fill="#00d2ff" opacity="0.18" />
      <line x1="0" y1="0" x2="120" y2="0" stroke="#00f2fe" stroke-width="2" opacity="0.8" />
    </g>
    <!-- Telematics GPS Coordinate Blips -->
    <circle cx="65" cy="-45" r="4" fill="#00f2fe" class="pulse-dot" />
    <circle cx="-50" cy="55" r="3.5" fill="#ff9900" class="pulse-dot" />
    <circle cx="85" cy="40" r="3" fill="#22c55e" class="pulse-dot" />
  </g>

  <!-- Ambient Glowing Orbs -->
  <circle cx="220" cy="80" r="140" fill="#00d2ff" opacity="0.08" filter="url(#glow)" />
  <circle cx="980" cy="240" r="160" fill="#3a7bd5" opacity="0.09" filter="url(#glow)" />
  <circle cx="600" cy="340" r="120" fill="#ff9900" opacity="0.05" filter="url(#glow)" />

  <!-- Dynamic Tech Transit Node Points (Geometric Hexagons & Rings) -->
  <g opacity="0.75">
    <!-- Hub A -->
    <g transform="translate(110, 195)" class="pulse-dot">
      <polygon points="0,-16 14,-8 14,8 0,16 -14,8 -14,-8" fill="none" stroke="#00d2ff" stroke-width="2" />
      <circle r="4" fill="#00d2ff" />
    </g>
    <!-- Hub B -->
    <g transform="translate(480, 50)" class="pulse-dot">
      <polygon points="0,-14 12,-7 12,7 0,14 -12,7 -12,-7" fill="none" stroke="#ff9900" stroke-width="1.8" />
      <circle r="3.5" fill="#ff9900" />
    </g>
    <!-- Hub C -->
    <g transform="translate(760, 310)" class="pulse-dot">
      <circle r="12" fill="none" stroke="#22c55e" stroke-width="2" stroke-dasharray="3, 3" />
      <circle r="4" fill="#22c55e" />
    </g>
  </g>

  <!-- Dynamic Floating Telematics Metric Cards (Right Side, Subtle & Styled) -->
  <g class="floating-card-1" transform="translate(860, 48)">
    <rect width="270" height="64" rx="12" fill="#0c1b3d" stroke="#1f3b73" stroke-width="1.5" opacity="0.9" />
    <circle cx="32" cy="32" r="14" fill="#00d2ff" opacity="0.2" />
    <text x="32" y="37" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" fill="#00d2ff" text-anchor="middle">🛰️</text>
    <text x="58" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#94a3b8" letter-spacing="1">REAL-TIME VISIBILITY</text>
    <text x="58" y="46" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#f8fafc">Multi-Modal TMS &amp; Tracking</text>
  </g>

  <g class="floating-card-2" transform="translate(890, 248)">
    <rect width="260" height="64" rx="12" fill="#0c1b3d" stroke="#1f3b73" stroke-width="1.5" opacity="0.9" />
    <circle cx="32" cy="32" r="14" fill="#ff9900" opacity="0.2" />
    <text x="32" y="37" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" fill="#ff9900" text-anchor="middle">📦</text>
    <text x="58" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#94a3b8" letter-spacing="1">INTELLIGENT FULFILLMENT</text>
    <text x="58" y="46" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#f8fafc">WMS, VRP &amp; Global Freight</text>
  </g>

  <!-- =================================================================== -->
  <!-- FOREGROUND: Core Typography & Title Branding (High Contrast & Clear) -->
  <!-- =================================================================== -->
  <g transform="translate(90, 75)">
    <!-- Small Category Pill -->
    <g transform="translate(0, 0)">
      <rect width="295" height="28" rx="14" fill="url(#pillGrad)" stroke="#00d2ff" stroke-width="1.2" opacity="0.95" />
      <circle cx="16" cy="14" r="5" fill="#00d2ff" class="pulse-dot" />
      <text x="32" y="19" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#38bdf8" letter-spacing="1.5">SUPPLY CHAIN &amp; LOGISTICS DIRECTORY</text>
    </g>

    <!-- Main Title Heading -->
    <text x="0" y="75" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="44" font-weight="900" fill="#ffffff" letter-spacing="-0.5">
      Awesome Logistics &amp;
    </text>
    <text x="0" y="128" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="44" font-weight="900" fill="url(#primaryGrad)" letter-spacing="-0.5" filter="url(#lightGlow)">
      Supply Chain Management
    </text>

    <!-- Subtitle / Mission Statement -->
    <text x="0" y="168" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="400" fill="#94a3b8">
      Curated Enterprise SaaS Platforms, Freight Visibility Networks, TMS, WMS &amp; Open-Source Solvers
    </text>

    <!-- Tech Badges / Pills -->
    <g transform="translate(0, 195)">
      <!-- Badge 1: TMS -->
      <g transform="translate(0, 0)">
        <rect width="78" height="24" rx="6" fill="#111e3b" stroke="#2563eb" stroke-width="1" />
        <text x="39" y="16" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="600" fill="#60a5fa" text-anchor="middle">🚚 TMS</text>
      </g>
      <!-- Badge 2: WMS -->
      <g transform="translate(88, 0)">
        <rect width="80" height="24" rx="6" fill="#111e3b" stroke="#0891b2" stroke-width="1" />
        <text x="40" y="16" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="600" fill="#22d3ee" text-anchor="middle">🏭 WMS</text>
      </g>
      <!-- Badge 3: Freight Visibility -->
      <g transform="translate(178, 0)">
        <rect width="138" height="24" rx="6" fill="#111e3b" stroke="#7c3aed" stroke-width="1" />
        <text x="69" y="16" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="600" fill="#c084fc" text-anchor="middle">📡 Real-Time IoT</text>
      </g>
      <!-- Badge 4: VRP & Route Planning -->
      <g transform="translate(326, 0)">
        <rect width="134" height="24" rx="6" fill="#111e3b" stroke="#d97706" stroke-width="1" />
        <text x="67" y="16" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="600" fill="#fbbf24" text-anchor="middle">🗺️ Route Solvers</text>
      </g>
      <!-- Badge 5: Open-Source -->
      <g transform="translate(470, 0)">
        <rect width="128" height="24" rx="6" fill="#111e3b" stroke="#16a34a" stroke-width="1" />
        <text x="64" y="16" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="600" fill="#4ade80" text-anchor="middle">💻 Open-Source</text>
      </g>
    </g>
  </g>
</svg>
